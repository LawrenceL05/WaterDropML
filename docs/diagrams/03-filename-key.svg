<text x="60" y="458.76" fill="#146755" font-family="Arial, sans-serif" font-size="16" font-weight="700" xml:space="preserve">CONDITION</text>
<text x="60" y="490.2" fill="#142D42" font-family="Arial, sans-serif" font-size="20" font-weight="400" xml:space="preserve">A = untreated   ·   B = UVO-treated</text>
<text x="544" y="458.76" fill="#146755" font-family="Arial, sans-serif" font-size="16" font-weight="700" xml:space="preserve">TIME CODE</text>
<text x="544" y="490.2" fill="#142D42" font-family="Arial, sans-serif" font-size="20" font-weight="400" xml:space="preserve">1 = 0 min   ·   2 = 30 min   ·   3 = 1 h   ·   4 = 3 h</text>
<rect x="42" y="545" width="1076" height="42" rx="12" fill="#FFFFFF" stroke="#B9CDDA" stroke-width="1.4"/>
<text x="60" y="570.34" fill="#39566B" font-family="Arial, sans-serif" font-size="19" font-weight="400" xml:space="preserve">If the shot suffix is omitted, the index records shot 1. Test folders are excluded.</text></svg>
