<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Read an image filename</title>
<desc id="desc">Example split into date, condition and time code, droplet, magnification and optional shot. All code mappings are in the adjacent README table.</desc>
<rect width="900" height="300" fill="white"/>
<text x="28" y="48.0" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#222222">Read an image filename</text>
<text x="28" y="108.0" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#4263a5">20261015_B3_2_30_1.jpg</text>
<rect x="28" y="141" width="204" height="115" fill="#e8eefb" stroke="#4263a5" stroke-width="2"/>
<text x="44" y="180.45" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">20261015</text>
<text x="44" y="205.14999999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Date</text>
<text x="44" y="229.85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">15 Oct 2026</text>
<rect x="232" y="141" width="188" height="115" fill="#e8f5e9" stroke="#28823b" stroke-width="2"/>
<text x="248" y="180.45" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">B3</text>
<text x="248" y="205.14999999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Condition / time</text>
<text x="248" y="229.85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">B; code 3</text>
<rect x="420" y="141" width="130" height="115" fill="#e8eefb" stroke="#4263a5" stroke-width="2"/>
<text x="436" y="180.45" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">2</text>
<text x="436" y="205.14999999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Droplet</text>
<text x="436" y="229.85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Droplet 2</text>
<rect x="550" y="141" width="162" height="115" fill="#e8eefb" stroke="#4263a5" stroke-width="2"/>
<text x="566" y="180.45" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">30</text>
<text x="566" y="205.14999999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Magnification</text>
<text x="566" y="229.85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">30×</text>
<rect x="712" y="141" width="160" height="115" fill="#e8eefb" stroke="#4263a5" stroke-width="2"/>
<text x="728" y="180.45" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">1</text>
<text x="728" y="205.14999999999998" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Shot (optional)</text>
<text x="728" y="229.85" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">Shot 1</text>
<text x="28" y="289.0" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">A = untreated   ·   B = UVO-treated   ·   Time code 3 = 1 h</text>
</svg>
